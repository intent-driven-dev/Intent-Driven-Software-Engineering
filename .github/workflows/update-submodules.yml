name: Update Submodules

on:
  workflow_dispatch:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update submodules
        run: |
          git submodule update --remote --recursive

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: update submodules to latest commits"
          title: "chore: update submodules to latest commits"
          body: |
            ## Description
            This PR updates all Git submodules to their latest commits.

            ### Submodules Updated:
            - ch2/vibey-url-shortener
            - ch2/spec-driven-url-shortener
            - ch4/url-shortener-speckit

            ### How to verify
            Review the submodule commit hashes to ensure they point to the desired commits.
          branch: chore/update-submodules
          delete-branch: true
